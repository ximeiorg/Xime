# ── 内置配置基座（随 APK 分发，升级时被覆盖，勿直接修改）──
# 用户自定义请写同目录 xime.custom.yaml：
#   · 只写要改的键，未写的键自动回退本文件的值；列表（layout.rows / schemas / base_urls）需整段写出
#   · 它不是 Rime 的 patch 层：直接写 keyboard: / style:，写 patch: 会被静默忽略
# 完整合并规则见 docs/config-merge-rules.md

metadata:
  app_name: Xime
  app_version: ">=2.5.0"
  platform: android
  config_version: 1
  generator: "Xime Config Generator" # 暂时无用
  modified_time: "2026-07-05"

xime_index:
  # 方案/插件/模型市场索引端点（ximeiorg/xime-index）。
  # 可替换为自建代理/镜像，下载器按顺序依次尝试，直到成功为止。
  # 末尾需要 /。
  base_urls:
    - "https://cdn.jsdelivr.net/gh/ximeiorg/xime-index@master/"
    - "https://fastly.jsdelivr.net/gh/ximeiorg/xime-index@master/"
    - "https://index.ximei.me/"
    - "https://raw.githubusercontent.com/ximeiorg/xime-index/refs/heads/main/"

style:
  # 浅色/深色模式的配色，deep 为降级后备
  # 可选值：内置主题 id、color_schemes 中定义的 id、或 dynamic（Material You 动态配色，随壁纸取色，仅 Android 12+ 生效）
  color_scheme:
    light: lavender_purple
    dark: slate_gray
  # 显示模式：0=浅色, 1=深色, 2=跟随系统（默认）
  dark_mode: 2

# ── 邻键误触纠错 ──
# schemas 声明启用纠错的方案（schema_id），未声明的方案不参与纠错（按键/候选零影响）。
# 语言侧证据（词频/词条）永远用方案自己的词典：五笔查五笔词典、拼音查拼音词典，
# 不跨码制混用。第三方方案在 xime.custom.yaml 同路径追加即可，与内置列表取并集：
#   correction:
#     schemas: [wubi98, wanxiang]
# 注意：①仅全拼/五笔这类「按键字母 = 编码」的方案可纠错；双拼（字母经拼写运算
# 变换）、九键（数字键）会在按键-编码对齐检查处自动跳过，不会误纠。②纠错打分的
# 词频区分度来自方案词典的 weight 列（有则用真值）；无 weight 的词典按
# 「完整词条 / 合法前缀 / 非法码」三值判定（仍可纠错，词间区分度弱一些），
# 任何时候都不会用其他方案的频次。
correction:
  schemas: [wubi86, wubi86_pinyin, pinyin_simp]

# ── 模糊拼音 ──
# 模糊规则（zh/z、n/l、an/ang…）是拼音字母层面的 speller/algebra fuzz，只对「全拼」
# 方案成立。Rime 方案没有类型字段，按 id/名称/代数结构猜测会把双拼、形码误判成
# 拼音并污染编码，所以这里只认显式声明：schemas 列出按全拼处理的 schema_id。
# 第三方全拼方案在 xime.custom.yaml 同路径追加即可，与内置列表取并集：
#   fuzzy_pinyin:
#     schemas: [wanxiang]
# 未声明的方案不会被写入任何模糊拼音补丁；双拼、九键、五笔不要声明。
fuzzy_pinyin:
  schemas: [pinyin_simp, rime_ice, rime_frost]

# 配色方案可配置背景类型（纯色/渐变/图片），默认均为纯色。
# 如需渐变/图片背景，在 xime.custom.yaml 的对应主题下覆盖 keyboard_background 即可：
#
#   keyboard_background:
#     type: gradient
#     colors: [0x8F73E2, 0xE8DEF8]        # 亮色渐变断点
#     colors_dark: [0x4A3F7A, 0x2D2040]    # 暗色渐变断点（可选）
#     angle: 90                            # 角度制
#  
#   keyboard_background:
#     type: image
#     src: "themes/lavender_bg.png"          # 相对于 rime/ 用户目录（优先）或 assets/
#     fit: cover                             # cover | contain | fill | fit_width | fit_height | none
#
# 自定义图片背景有两种方式：
# 1. 在系统相册/文件管理中把图片「分享到 Xime」，图片会自动存入
#    rime/themes/custom_<时间戳>.jpg，并把可用的 color_schemes 配置模板复制到剪贴板，
#    粘贴到 rime/xime.custom.yaml 后即可在主题设置中选择。
# 2. 手动把图片放入 rime/themes/（如通过 USB 或文件管理器），然后在
#    xime.custom.yaml 中添加引用它的 color_scheme，src 写相对 rime/ 的路径。
#    内置主题的同名文件会被用户目录中的文件覆盖。
#
# color_schemes 每个主题可用的颜色字段（未设置的会回退到全局 keyboard.colors 默认值）：
#   primary_color          - 主题强调色（种子色）
#   keyboard_bg_color      - 键盘背景后备色（配置了 keyboard_background 时以 background 为准）
#   key_bg_color / key_bg_color_dark           - 按键底色（亮/暗）
#   special_key_bg_color / _dark               - 特殊按键底色（亮/暗）
#   candidate_bar_bg_color                     - 候选栏底色
#   key_text_color / key_text_color_dark       - 按键文字色（亮/暗）
#   candidate_text_color / _dark               - 候选文字色（亮/暗）
#   candidate_selected_text_color / _dark      - 候选选中文字色（亮/暗），未设置时亮色回退
#                                                 primary_color 原色、暗色回退 primary 提亮 45%
#                                                 （灰色系 primary 提亮后仍偏暗时建议单独配置）
#   candidate_selected_bg_color / _dark        - 候选选中背景色（亮/暗），未设置时按
#                                                 primary_color 20% 透明派生；支持
#                                                 0xAARRGGBB（如 0x33FF0000）自定义透明度
#
# ── 暗色配色约束（新增皮肤时请遵守，详见 docs/theme-dark-colors.md）──
# 1. 暗色功能键不再默认取 primary_color：主色的 OKLCH 彩度普遍在 0.16~0.21，
#    整块铺在深底上会"发光"。请显式写 special_key_bg_color_dark，彩度压到 C ≤ 0.13。
# 2. 渐变皮肤（type: gradient）的 colors_dark 暗端请压到 OKLCH L ≤ 0.32 / C ≤ 0.10：
#    该色占了整块键面，是暗环境里最大的亮度来源。
# 3. 深底皮肤的功能键与普通键亮度比（vs 普通键）建议 ≥ 1.3，否则只剩色相差异，看不清。
#
color_schemes:
  # 动态配色（Material You）：颜色由运行时从壁纸调色板派生，随壁纸变化，
  # 仅 Android 12+（API 31+）生效，低版本不显示此方案。
  # dynamic_color: true 时忽略静态颜色字段；style.color_scheme 可用 dynamic 引用。
  dynamic:
    name: "动态配色"
    dynamic_color: true

  lavender_purple:
    name: "薰衣草紫"
    primary_color: 0x8F73E2
    # 暗色功能键：主色 C=0.162 在 #1E1838 上偏艳，压到 C=0.13（明度不变，紫调仍可辨）。
    special_key_bg_color_dark: 0x8d79d1
    keyboard_background:
      type: solid
      color: 0xE3E4E8
      color_dark: 0x1E1838
  
  ocean_blue:
    name: "海洋蔚蓝"
    primary_color: 0x1A73E8
    # 暗色功能键：主色 C=0.195（全表第二高）压在 #0D1B33 上荧光感强，压到 C=0.13。
    special_key_bg_color_dark: 0x4478c4
    keyboard_background:
      type: solid
      color: 0xE3E4E8
      color_dark: 0x0D1B33
  
  sunset_orange:
    name: "落日橙光"
    primary_color: 0xE65100
    # 深色功能键（确定/删除等）降饱和，避免暗光下刺眼；亮色仍回退 primary 派生
    special_key_bg_color_dark: 0xD97757
    keyboard_background:
      type: solid
      color: 0xE3E4E8
      color_dark: 0x1A0D00

  slate_gray:
    name: "沉稳石墨"
    primary_color: 0x424242
    # 灰色系 primary 提亮后仍偏暗（≈0x979797），深色模式首选项单独提亮保证辨识度
    # （非纯白，高对比在暗光下刺眼；普通候选为 0xE8EAED，靠字重+高亮底区分）
    candidate_selected_text_color_dark: 0xF0F0F0
    keyboard_background:
      type: solid
      color: 0xE3E4E8
      color_dark: 0x1A1A1A
  
  rose_pink:
    name: "浪漫玫瑰"
    primary_color: 0xAD1457
    # 深色下功能键整块铺色：直接取主色是 79% 饱和的洋红，压在 #2D1020 上过于刺眼。
    # 降饱和会变成藕灰粉（撞樱花粉黛的粉色观感），故改为压明度到 33%、保留 64% 饱和，
    # 走深酒红：暗色块不刺眼，同时保住玫瑰的色彩身份。
    special_key_bg_color_dark: 0x8B1E42
    keyboard_background:
      type: solid
      color: 0xE3E4E8
      color_dark: 0x2D1020
  
  teal_cyan:
    name: "青碧如水"
    primary_color: 0x00796B
    keyboard_background:
      type: solid
      color: 0xE3E4E8
      color_dark: 0x002622

  sakura_pink:
    name: "樱花粉黛"
    primary_color: 0xe91e63
    # 该皮肤深色模式为浅色视觉，功能键深色也用浅粉（与亮色派生值一致），
    # 避免饱和粉红大色块；文字色由宿主按背景亮度自适应取按键文字色
    special_key_bg_color_dark: 0xFAD2E0
    keyboard_background:
      type: solid
      color: 0xfdf0f4
      color_dark: 0xfdf0f4
    key_bg_color: 0xfff8fb
    key_bg_color_dark: 0xfff8fb
    key_text_color: 0x7d3a52
    key_text_color_dark: 0x7d3a52
    candidate_text_color: 0x7d3a52
    candidate_text_color_dark: 0x7d3a52

  sky_blue:
