  # 九键（T9）键盘配置
  # 注意：本键盘不支持 button_layout（按键布局模式），固定 standard 键面布局；
  # 此处配置 button_layout: compact 不生效（compact 仅全键盘段支持：qwerty/qwerty_en 与合并键段；本段不解析）。
  # schemas 声明使用九键布局的方案，未声明的方案一律全键盘；
  # 第三方九键方案在 xime.custom.yaml 的 t9.schemas 追加即可，无需改代码。
  t9:
    type: t9
    schemas: [t9_pinyin, t9, wanxiang_t9, rime_frost_t9]
    # ── 布局（三列结构，可完全自定义；未配置时为以下内置默认，与历史布局一致）──
    # left：左列（自上而下）。candidates 是候选/符号面板占位（不是可提交的按键）：
    #   候选态显示音节选项（点选音节），空闲态显示下方 side_symbols
    #   （固定 4 等分高度，>4 个可上下滚动）。也可放功能键或自定义键。
    # rows：主区（中间列）按行，每行一个键 id 列表。
    # right：右列（自上而下）。
    # 键 id 分三类：
    #   1. 数字 "0"~"9"：九键输入键。点按默认走九键数字输入（T9 核心交互），
    #      写 keys.<id>.tap.action 即可按手势动作改绑（不写 action 则保持内置行为）；
    #      键面字母用 keys.<id>.tap.label 覆盖（内置：1=分词、2=ABC…9=WXYZ），
    #      长按候选用 keys.<id>.long_press（未配置时用内置 2=A/B/C…9=W/X/Y/Z、1 无长按；
    #      配置后每项可用 action 触发任意动作，1 也能拥有长按候选），
    #      手势在 keys.<id> 配置（下方内置默认：上滑直接输入键面数字）。
    #   2. 功能键：candidates / symbol(符号) / number(数字面板) / space(空格) /
    #      earth(中英切换) / delete(退格) / clear(重输) / enter(回车)。
    #      组件与行为内置，位置可任意安排；键在行/列中的相对宽度用 keys.<id>.width 覆盖
    #      （默认：candidates 3、space 1.8、enter 2，其余 1）。
    #   3. 其他任意 id：自定义键，行为在 keys.<id> 定义（tap.label 为键面文字，
    #      缺省键面显示键名、点按提交键名本身；手势同全键盘写法）。
    layout:
      left: [candidates, symbol]
      rows:
        - ["1", "2", "3"]
        - ["4", "5", "6"]
        - ["7", "8", "9"]
        - [number, space, earth]
      right: [delete, clear, enter]
    # ── 左侧快捷符号栏（空闲态显示；列表长度不限，超过 4 个时可上下滑动）──
    # 用户在 xime.custom.yaml 的同路径覆盖整个列表，未配置时使用内置默认值
    side_symbols:
      - "，"
      - "。"
      - "？"
      - "！"
      - "%"
    # ── 数字键手势（可自定义：在 xime.custom.yaml 的 keyboard.t9.keys 同路径覆盖）──
    # 键 id 为数字字符串 "1"~"9"（也可为 layout 中出现的自定义键 id）。
    # 内置默认：上滑直接输入键面数字（无需切数字键盘）；下滑/左滑/右滑内置不绑定动作，
    # 可按键级自行配置（如 swipe_down: { label: "复制", action: "copy" }，
    # 或 switch_route: clipboard 打开剪贴板面板）。
    # 左右滑默认不绑定：横向滑动仍用于移动光标；某键配置了 swipe_left/swipe_right 后，
    # 该键上的横向滑动即由按键接管（执行配置动作），不再移动光标（未配置的键不受影响）。
    # 提示显示：上/下/左/右滑的 label 均按 display 画在键面（上=键上方、下=键下方、
    # 左/右=键边缘与居中主字符之间的空档正中）；display: bubble 时不印键面。
    # 动作可选值见 GestureAction：commit/select_all/copy/cut/paste/line_start/line_end/
    # undo/repeat/command/switch_route（value: emoji|symbol|clipboard 打开对应面板）等；
    # display 只管静态提示位置：key（画在键面）/ bubble（不画键面，留给气泡）/ both；
    # bubble 独立控制运行时是否弹气泡（默认 true）。二者互不影响。
    # 内置默认 display: "key" + bubble: false：数字作为键面角标提示、拖动不弹气泡。
    # 想要拖动气泡自行改为 bubble: true。手势功能与提示相互独立。
    keys:
      # 内置默认键面（tap.label 键面字母组）与长按候选（long_press.values，弹出气泡
      # 滑动选择后上屏所选文本）直接写在下方，可按需修改；"1" 无长按为历史行为。
      # 注意 keys 覆盖是键级整体替换：在 xime.custom.yaml 覆盖某个数字键时，
      # 键面/长按/手势要一并写上，漏写的字段回退代码内置兜底。
      "1": { tap: { label: "分词" }, swipe_up: { action: commit, value: "1", display: "key", bubble: false } }
      "2": { tap: { label: "ABC" }, long_press: { display: "bubble", values: [{ action: commit, value: "A" }, { action: commit, value: "B" }, { action: commit, value: "C" }] }, swipe_up: { action: commit, value: "2", display: "key", bubble: false } }
      "3": { tap: { label: "DEF" }, long_press: { display: "bubble", values: [{ action: commit, value: "D" }, { action: commit, value: "E" }, { action: commit, value: "F" }] }, swipe_up: { action: commit, value: "3", display: "key", bubble: false } }
      "4": { tap: { label: "GHI" }, long_press: { display: "bubble", values: [{ action: commit, value: "G" }, { action: commit, value: "H" }, { action: commit, value: "I" }] }, swipe_up: { action: commit, value: "4", display: "key", bubble: false } }
      "5": { tap: { label: "JKL" }, long_press: { display: "bubble", values: [{ action: commit, value: "J" }, { action: commit, value: "K" }, { action: commit, value: "L" }] }, swipe_up: { action: commit, value: "5", display: "key", bubble: false } }
      "6": { tap: { label: "MNO" }, long_press: { display: "bubble", values: [{ action: commit, value: "M" }, { action: commit, value: "N" }, { action: commit, value: "O" }] }, swipe_up: { action: commit, value: "6", display: "key", bubble: false } }
      "7": { tap: { label: "PQRS" }, long_press: { display: "bubble", values: [{ action: commit, value: "P" }, { action: commit, value: "Q" }, { action: commit, value: "R" }, { action: commit, value: "S" }] }, swipe_up: { action: commit, value: "7", display: "key", bubble: false } }
      "8": { tap: { label: "TUV" }, long_press: { display: "bubble", values: [{ action: commit, value: "T" }, { action: commit, value: "U" }, { action: commit, value: "V" }] }, swipe_up: { action: commit, value: "8", display: "key", bubble: false } }
      "9": { tap: { label: "WXYZ" }, long_press: { display: "bubble", values: [{ action: commit, value: "W" }, { action: commit, value: "X" }, { action: commit, value: "Y" }, { action: commit, value: "Z" }] }, swipe_up: { action: commit, value: "9", display: "key", bubble: false } }
      # 空格上滑直接输入 0（不经九键组合，与数字键上滑同路径）；
      # 功能键也可按此方式配置手势（space/earth/delete/clear/enter 等）
      space: { swipe_up: { action: commit, value: "0", display: "key", bubble: false } }

  # 笔画键盘配置
  # 注意：本键盘不支持 button_layout（按键布局模式），固定 standard 键面布局；
  # 此处配置 button_layout: compact 不生效（compact 仅全键盘段支持：qwerty/qwerty_en 与合并键段；本段不解析）。
  # schemas 声明使用笔画布局的方案，未声明的方案一律全键盘；
  # 第三方笔画方案在 xime.custom.yaml 的 stroke.schemas 追加即可。
  stroke:
    type: stroke
    schemas: [stroke]
    # ── 左侧快捷符号列（常显；列表长度不限，超过 3 个时滚动显示）──
    # 用户在 xime.custom.yaml 的同路径覆盖整个列表，未配置时使用内置默认值
    side_symbols:
      - "。"
      - "？"
      - "！"
      - "~"
    # ── 笔画键手势（可自定义：在 xime.custom.yaml 的 keyboard.stroke.keys 同路径覆盖）──
    # 键 id 为键面标签；内置默认：上滑输入对应数字（与历史行为一致，此前版本该手势
    # 因缺少滑动提示文本实际不触发，现修复生效），下滑可按需绑定编辑动作。
    # display：key（画在键面）/ bubble（不画键面，留给气泡）/ both；bubble 独立控制
    # 运行时是否弹气泡（默认 true）。上滑内置 display: "key" + bubble: false（不弹气泡，
    # 数字提示由键面角标承担）；tap 内置 bubble: false（按压不弹预览气泡，与九键拼音
    # 键盘的无气泡交互对齐）。手势功能与提示相互独立。
    keys:
      "一": { tap: { bubble: false }, swipe_up: { action: commit, value: "1", display: "key", bubble: false } }
      "丨": { tap: { bubble: false }, swipe_up: { action: commit, value: "2", display: "key", bubble: false } }
      "丿": { tap: { bubble: false }, swipe_up: { action: commit, value: "3", display: "key", bubble: false } }
      "丶": { tap: { bubble: false }, swipe_up: { action: commit, value: "4", display: "key", bubble: false } }
      "乛": { tap: { bubble: false }, swipe_up: { action: commit, value: "5", display: "key", bubble: false } }
      "*": { tap: { bubble: false }, swipe_up: { action: commit, value: "6", display: "key", bubble: false } }
      "分词": { tap: { bubble: false }, swipe_up: { action: commit, value: "7", display: "key", bubble: false } }
      "，": { tap: { bubble: false }, swipe_up: { action: commit, value: "8", display: "key", bubble: false } }
      "英": { tap: { bubble: false }, swipe_up: { action: commit, value: "9", display: "key", bubble: false } }
      # 空格上滑直接输入 0（与笔画键上滑同路径，直接上屏）
      space: { swipe_up: { action: commit, value: "0", display: "key", bubble: false } }

  # 手写键盘配置
  # schemas 声明使用手写布局的方案：手写不经过 rime 引擎（由 HandwritingEngine
  # 识别，模型在应用内管理），切换时不调 rime switchSchema、不走个人词典。
  # 未声明的方案一律全键盘；第三方手写方案在 xime.custom.yaml 的
  # handwriting.schemas 追加即可，无需改代码。
  handwriting:
    type: handwriting
    schemas: [handwriting]

  # ── 数字键盘（columns 三列布局：左列键柱 / 中列数字区 / 右列功能列）──
  # 列项支持纵向键柱子数组（如 ["+","-","*","/"] 四键一柱，首尾键自动合并圆角、柱内无间隙）；
  # 三列宽度与列内键高为内置比例（0.8 / 3.4 / 0.8），不受 keys.<id>.width 影响。
  # 键 id：数字与运算符是值键（点按直接上屏）；功能键 back(返回字母键盘) / open_symbols(打开
  # 全量符号面板) / space_bar(空格) / delete / emoji / enter 的行为内置，keys.<id> 只用来覆盖
  # 宽度与键面文字（enter / delete 支持配动作）。
  # 返回键（back）默认显示图标；进入位置记忆由渲染层交换 left 末键与 rows 末行首键实现。
  # 键间距沿用 keyboard.key.number；平板设备档变体：写 number_tablet 段即可整段替换（同 qwerty_tablet）。
  number:
    type: columns
    layout:
      left:
        - ["+", "-", "*", "/"]
        - back
      rows:
        - [1, 2, 3]
        - [4, 5, 6]
        - [7, 8, 9]
        - [open_symbols, 0, "."]
      right: [delete, space_bar, emoji, enter]
    keys:
      enter: { tap: { action: send_rime, value: enter, label: "确定" } }

  # ── 常用符号键盘（rows 行布局；中英共用一套，不再分中/英两段、没有 En 键）──
  # 符号默认用**中文形态**（＠＃＄… 、＊“”！？），只有 `,` 与 `.` 保留半角 ASCII
  #（写代码/英文时更顺手）。符号键是值键（点按直接上屏）；功能键 back / number(切数字面板) /
  # open_symbols / space_key(空格) / delete / enter 行为内置，keys.<id> 只用来覆盖宽度与键面文字。
  # 键间距沿用 keyboard.key.symbol（面板旧名，与段名不同，保持老配置兼容）。
  common_symbols:
    type: full
    layout:
      rows:
        - [1, 2, 3, 4, 5, 6, 7, 8, 9, 0]
        - ["＠", "＃", "＄", "＆", "＿", "－", "＋", "（", "）", "／"]
        # 引号成对：左双引号 + 右双引号（旧配置误用了 左双 + 右单）
        - [open_symbols, "＊", "“", "”", "！", "？", ",", ".", delete]
        - [back, number, space_key, enter]
    keys:
      open_symbols: { width: 1.3 }
      delete: { width: 1.2 }
      back: { tap: { label: "返回" }, width: 1.2 }
      space_key: { width: 2.5 }
      enter: { width: 1.2, tap: { action: send_rime, value: enter, label: "确定" } }

  # ── 平板/大屏面板布局（设备档变体：平板上自动整段替换同名基础段，手机不受影响）──
  #
  # 布局取自平板设计稿（4 行；数字面板 9 列、符号面板 12 列）。符号面板中英共用一套（无 En 键）。width 与其它段一样是
  # 「行内相对宽度」：1 = 一个标准键，**未写 width 的键就是 1**；数值由设计稿实测键面
  # 比例取一位小数得到（例如数字面板的数字列 ≈ 2.3 个标准键宽、符号面板的超宽空格 6.7）。
  # 配合下面 keyboard.key.<段名>_tablet 的 4/6dp 键面内衬与面板 16dp 外围留白，与平板 26 键
  # 同档：键面距屏幕边 20dp、相邻键面横 8dp / 竖 12dp。
  # （间距档从设计稿的 12dp 收到 26 键的 8dp，键面本身会比设计稿略宽约 3.5dp；一位小数取整
  #   再带 1~5dp 误差。要严格复刻设计稿的键面宽，把 width 各乘 5 写一位小数即可零误差。）
  # 键面文字/图标/配色一律沿用现有键组件与主题色，设计稿只提供「键位与比例」。
  # 用户可在 xime.custom.yaml 写同名段整段覆盖（例如给平板的数字键盘加中英切换键）。
  #
  # 数字键盘：9 列 × 4 行 = 符号 3 列 / 数字 3 列 / 运算符 2 列 / 功能列
  # （右端返回键 back_right 与左端 back 同行为、宽度各自独立）
  number_tablet:
    type: full
    layout:
      rows:
        - ["(", ")", ":", "1", "2", "3", "+", "-", delete]
        - ["!", "?", ";", "4", "5", "6", "*", "/", enter]
        - ["#", "$", "%", "7", "8", "9", "=", "&", space_key]
        - [back, open_symbols, ",", "0", ".", cursor_left, cursor_right, back_right]
    keys:
      # 数字列（比符号/运算符列宽：设计稿 τ≈2.4 个标准键宽）
      "1": { width: 2.3 }
      "2": { width: 2.3 }
      "3": { width: 2.3 }
      "4": { width: 2.3 }
      "5": { width: 2.3 }
      "6": { width: 2.3 }
      "7": { width: 2.3 }
      "8": { width: 2.3 }
      "9": { width: 2.3 }
      "0": { width: 2.3 }
      ",": { width: 2.3 }
      ".": { width: 2.3 }
      # 两端返回 / 符号入口（设计稿 τ≈1.5）
      back: { width: 1.5 }
      open_symbols: { width: 1.5 }
      # 其余（符号 / 运算符 / 功能列 delete·enter·space_key / 光标键 / back_right）都是标准键宽 = 1

  # 常用符号键盘（平板）：12 列 × 4 行，中英共用一套（与手机同一套字形：
  # 符号默认中文形态，`,/` 与 `.` 保留半角）
  common_symbols_tablet:
    type: full
    layout:
      rows:
        - [tab, 1, 2, 3, 4, 5, 6, 7, 8, 9, 0, delete]
        - [caps, "＠", "＃", "＄", "＿", "＆", "－", "＋", "（", "）", enter]
        # 与手机同序：符号（含平板多出的 ：；／），行尾固定 "， , ."（, 与 . 保留半角）
        - [open_symbols, "＊", "“", "”", "：", "；", "！", "？", "／", ",", "."]
        - [back, number, space_key, cursor_left, cursor_right, back_right]
    keys:
      # 与平板 26 键**逐列同宽**（行内权重与行总和都对齐，切换键盘不跳）：
      #   行1 tab/delete 1.1 ←→ 26 键 tab/delete；行2 caps 1.3、enter 1.4 ←→ 26 键 caps/enter；
      #   行3 符号入口 1.6 ←→ shift_left，行尾 "." 1.2 ←→ shift_right；
      #   行4 返回 1.2 ←→ mode_change，空格 5.5 ←→ 26 键空格，back_right 1.2 ←→ 右端 mode_change。
      # 未写的键（数字 / 符号 / 光标 / number）都是标准键宽 1，与 26 键的字母/emoji 列同位同宽。
      tab: { width: 1.1 }
      delete: { width: 1.1 }
      caps: { width: 1.3 }
      enter: { width: 1.4 }
      open_symbols: { width: 1.6 }
      back: { width: 1.2 }
      space_key: { width: 5.5 }
      back_right: { width: 1.2 }
      # 行 3 行尾（"." 正好落在 26 键 shift_right 那一列）
      ".": { width: 1.2 }
