# ── 26 键全键盘手势配置 ──
# 每个按键可定义以下手势：
#   tap:         点按
#   double_tap:  双击
#   swipe_up:    上滑
#   swipe_down:  下滑
#   swipe_left:  左滑
#   swipe_right: 右滑
#   long_press:  长按（数组，弹出气泡后左右滑动选择）
#
# 左右滑与整片键盘滑动移动光标的关系：
#   在键盘区域横向滑动默认用于移动光标；若某键配置了 swipe_left / swipe_right，
#   该键上的横向滑动即由按键接管（执行配置动作），不再移动光标；未配置左右滑的键
#   横向滑动仍用于移动光标。
#
# 每个手势的值格式：
#   - 字符串 "a" → 按槽位默认动作（tap 为 send_rime：走按键路由进 rime，与手敲
#     该键一致；swipe/长按为 commit：输出 value 直接上屏），显示也是它。
#     本文件已显式写出 action: commit 的是真·直接上屏的手势：长按气泡候选、
#     九键/笔画键上滑输数字；全键盘字母区的上滑保持简写——槽位默认 commit，
#     但执行时沿用按键路由（与手敲该键一致，非绕过引擎直出）
#   - { label, action, value }
#     （对象形式省略 action 时取槽位默认）
#     label:  按键上显示的文字
#     action: send_rime（走按键路由进 rime 组合，tap 的默认，与手敲该键同一路由）,
#             commit（输出 value 直接上屏，swipe/长按的默认）,
#             command（内置命令，value 为命令名）,
#             select_all, copy, cut, paste, line_start, line_end, undo, none, repeat,
#             功能键：delete, enter, newline（固定换行，无视编辑器回车动作）, space, repeat_space（value 为次数，默认 5），
#                     clear_all, undo_clear, toggle_ascii, toggle_symbols, toggle_shift,
#                     cycle_schema（轮换到下一个已启用输入方案，顺序同菜单栏方案列表，末尾回到首个）,
#                     voice（进入语音输入）, switch_route（value: emoji|symbol|clipboard）
#     command 可用命令（会走键盘按键路由，与"点击对应按键"等价）：
#       clear_composition - 清空当前输入编码和候选词
#       show_ime_picker   - 显示系统输入法选择器
#       mode_change       - 切换符号 / 数字面板（与 ?123 同）
#       mode_change_number         - 切到数字面板
#       mode_change_common_symbol  - 切到常用符号面板
#       shift_single      - 单击 Shift 语义
#       shift_caps        - 双击 Shift 语义（锁定大写）
#       emoji / symbol    - 打开表情 / 符号面板
#     value:  上屏时的输出文本（不指定则用 label）
#   - 键级可选 width：列宽比例（数字）。字母键默认等宽（1），功能键有内置默认；
#     设置后仅改变该键宽度占比，不显示为文字。
#
# long_press 示例（弹出多个选项供滑动选择）：
#   long_press: { display: "bubble", values: [ { label: "大写", action: "commit", value: "A" }, { label: "Ä", action: "commit", value: "ä" } ] }
#   # 也支持字符串简写：
#   long_press: { display: "bubble", values: ["q", "Q"] }
#   # 单个动作可直写（不写 values，等价于只含这一项的列表）；bubble: false 时不弹气泡、长按直接执行：
#   long_press: { label: "语音", action: "voice", bubble: false }
keyboard:
  # ── 键盘颜色配置（可选，不设置则使用内置默认值）──
  # 背景色已由 color_schemes.*.keyboard_background 接管
  # key_bg_color             - 按键底色（亮色）
  # key_bg_color_dark        - 按键底色（暗色）
  # special_key_bg_color     - 特殊按键底色（亮色）
  # special_key_bg_color_dark- 特殊按键底色（暗色）
  # key_text_color           - 按键文字颜色（亮色）
  # key_text_color_dark      - 按键文字颜色（暗色）
  # candidate_text_color     - 候选文字颜色（亮色）
  # candidate_text_color_dark- 候选文字颜色（暗色）
  colors:
    key_bg_color: 0xFFFFFF
    key_bg_color_dark: 0x60FFFFFF
    # special_key_bg_color: 0x9fef86 #不设置时默认取主题色
    # special_key_bg_color_dark: 0x4A4A4A #不设置时默认取主题色
    key_text_color: 0x202124
    key_text_color_dark: 0xE8EAED
    candidate_text_color: 0x202124
    candidate_text_color_dark: 0xE8EAED
  
  # ── 按键配置（可选，不设置则使用默认值）──
  # corner_radius:      按键圆角半径（dp，默认 8），独立于 shadow.shape_radius
  # spacing_x:          按键横向间距（dp，默认 2），未设置时各键盘使用自身默认值
  # spacing_y:          按键竖向间距（dp，默认 4.25；横屏默认 2），未设置时各键盘使用自身默认值
  # 各键盘可单独覆盖圆角与间距（可选），键盘名：qwerty / t9 / number / stroke / symbol
  # （handwriting 手写键盘的键面尺寸写在代码里，圆角同样认 handwriting 这个名字）；
  # 平板设备档另可写 <键盘名>_tablet（平板上覆盖同名基础覆盖，见下方示例）。
  # 例如：t9: { corner_radius: 8, spacing_x: 1, spacing_y: 2 }
  key:
    corner_radius: 8
    spacing_x: 2
    spacing_y: 4.25
    t9: { spacing_x: 2, spacing_y: 2 }
    number: { spacing_x: 2, spacing_y: 2 }
    stroke: { spacing_x: 2, spacing_y: 2 }
    symbol: { spacing_x: 2, spacing_y: 4 }
    # 平板设备档：面板与平板 26 键同档——键面内衬 4/6dp（相邻键面横 8dp / 竖 12dp），
    # 配合键盘区两侧 16dp 外围留白，键面距屏幕边同为 20dp（手机不受影响）。
    # 圆角：这里没写覆盖时按设备档——平板所有键盘（26 键 / 数字 · 常用符号面板 / 九键 / 笔画 /
    # 手写）统一用大键面档（不小于 14dp），手机用上面的全局 corner_radius；
    # 要单独调就写键盘名，例如
    #   qwerty_tablet: { corner_radius: 12 } / symbol: { corner_radius: 10 }
    t9_tablet: { spacing_x: 4, spacing_y: 6 }
    stroke_tablet: { spacing_x: 4, spacing_y: 6 }
    number_tablet: { spacing_x: 4, spacing_y: 6 }
    symbol_tablet: { spacing_x: 4, spacing_y: 6 }

  # ── 按键阴影（可选，不设置则使用默认值）──
  # enabled:            是否启用阴影
  # elevation:          阴影高度（dp，默认 0.5）
  shadow:
    enabled: true
    elevation: 0.5

  # ── 字体配置（可选，配置为空时使用系统默认字体）──
  # 字体路径查找规则：
  #   - 绝对路径（以 / 开头）：从根目录找起，如 /fonts/myfont.ttf
  #   - 相对路径（包含 /）：相对于 rime/ 目录，如 fonts/myfont.ttf
  #   - 仅文件名：相对于 rime/ 目录查找，如 myfont.ttf
  fonts:
    key_font: ""
    key_label_font: ""
    candidate_font: ""
    comment_font: ""

  qwerty:
    # ── 按键布局模式（仅 26 键键盘支持；九键/笔画等其余键盘固定 standard，配置不生效）──
    # standard: 默认布局（主文字居中，下滑提示在底部）
    # compact: 紧凑布局（主文字在左上，下滑提示占满键帽中部）
    button_layout: standard
    layout:
      # ── 行宽与对齐（均可选，写在 layout 下作用于整段键盘）──
      # columns:   参考列数，缺省取首行键数；uniform 下决定行宽与键宽
      # row_align: uniform（默认）= 键宽按列对齐、行居中；stretch = 行内均分铺满
      # 行可写成数组（继承键盘级策略），或对象形式做行级覆盖：
      #   - { keys: [a, s, d, f, g, h, j, k, l], align: stretch }   # 该行满宽均分
      #   - { keys: [z, x, c, v, b, n, m], width: 0.7 }             # 该行占 70% 宽（居中）
      # columns: 10
      # row_align: uniform
      rows:
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l]
        - [shift, z, x, c, v, b, n, m, delete]
        # 第四行（控制行）：位置/是否出现由本 rows 决定，行为在下方 keys.<id> 配置
        - [mode_change, comma, space, earth, enter]
    keys:
      # ── 第一行 ──
      # long_press 顺序：小写 → 大写 → 带变音符号的相似字母
      # swipe_down 显示对应的五笔字根（action:none 仅显示不上屏）
      # display: bubble → 气泡显示；key → 显示在按键上（最多显示 2 个字）
      q: { tap: "q", swipe_up: "1", swipe_down: { label: "金 钅𠂊勺㐅 犭𱼀", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "q" }, { action: commit, value: "Q" }] } }
      w: { tap: "w", swipe_up: "2", swipe_down: { label: "人亻八癶", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "w" }, { action: commit, value: "W" }] } }
      e: { tap: "e", swipe_up: "3", swipe_down: { label: "月⺼彡乃用爫彡𧘇豕", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "e" }, { action: commit, value: "E" }, { action: commit, value: "è" }, { action: commit, value: "é" }, { action: commit, value: "ê" }, { action: commit, value: "ë" }] } }
      r: { tap: "r", swipe_up: "4", swipe_down: { label: "白手龵扌斤𰀪𠂆", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "r" }, { action: commit, value: "R" }] } }
      t: { tap: "t", swipe_up: "5", swipe_down: { label: "禾竹丿𠂉彳夂攵", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "t" }, { action: commit, value: "T" }] } }
      y: { tap: "y", swipe_up: "6", swipe_down: { label: "言讠文方广亠丶乀", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "y" }, { action: commit, value: "Y" }, { action: commit, value: "ÿ" }] } }
      u: { tap: "u", swipe_up: "7", swipe_down: { label: "立六辛冫丬门疒丷䒑", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "u" }, { action: commit, value: "U" }, { action: commit, value: "ù" }, { action: commit, value: "ú" }, { action: commit, value: "û" }, { action: commit, value: "ü" }] } }
      i: { tap: "i", swipe_up: "8", swipe_down: { label: "水氵小氺头𭕄⺌", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "i" }, { action: commit, value: "I" }, { action: commit, value: "ì" }, { action: commit, value: "í" }, { action: commit, value: "î" }, { action: commit, value: "ï" }] } }
      o: { tap: "o", swipe_up: "9", swipe_down: { label: "火灬米", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "o" }, { action: commit, value: "O" }, { action: commit, value: "ò" }, { action: commit, value: "ó" }, { action: commit, value: "ô" }, { action: commit, value: "õ" }, { action: commit, value: "ö" }, { action: commit, value: "ø" }] } }
      p: { tap: "p", swipe_up: "0", swipe_down: { label: "之辶冖宀廴礻", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "p" }, { action: commit, value: "P" }] } }

      # ── 第二行 ──
      a: { tap: "a", swipe_up: { label: "～", value: "~" }, swipe_down: { label: "工匚戈艹廿龷七弋戈", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "a" }, { action: commit, value: "A" }, { action: commit, value: "à" }, { action: commit, value: "á" }, { action: commit, value: "â" }, { action: commit, value: "ã" }, { action: commit, value: "ä" }, { action: commit, value: "å" }, { action: commit, value: "æ" }] } }
      s: { tap: "s", swipe_up: { label: "／", value: "/" }, swipe_down: { label: "木丁西", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "s" }, { action: commit, value: "S" }, { action: commit, value: "ß" }] } }
      d: { tap: "d", swipe_up: { label: "：", value: ":" }, swipe_down: { label: "大犬三古龵镸石厂丆", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "d" }, { action: commit, value: "D" }] } }
      f: { tap: "f", swipe_up: { label: "；", value: ";" }, swipe_down: { label: "土士二干十寸雨", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "f" }, { action: commit, value: "F" }] } }
      g: { tap: "g", swipe_up: { label: "“", value: "“" }, swipe_down: { label: "王龶五一戋", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "g" }, { action: commit, value: "G" }] } }
      h: { tap: "h", swipe_up: { label: "”", value: "”" }, swipe_down: { label: "目丨卜⺊上止龰", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "h" }, { action: commit, value: "H" }] } }
      j: { tap: "j", swipe_up: { label: "－", value: "-" }, swipe_down: { label: "日曰早廾刂虫丿Ⅱ", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "j" }, { action: commit, value: "J" }] } }
      k: { tap: "k", swipe_up: { label: "（", value: "(" }, swipe_down: { label: "口Ⅲ川", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "k" }, { action: commit, value: "K" }] } }
      l: { tap: "l", swipe_up: { label: "）", value: ")" }, swipe_down: { label: "田甲囗四罒车皿力", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "l" }, { action: commit, value: "L" }] } }
      # ── 第三行 ──
      z: { tap: "z", swipe_up: { label: "＊", value: "*" }, swipe_down: { label: "", action: "none", display: "key", bubble: false }, long_press: { display: "bubble", values: [{ action: commit, value: "z" }, { action: commit, value: "Z" }] } }
      x: { tap: "x", swipe_up: { label: "＠", value: "@" }, swipe_down: { label: "弓匕纟幺弓𠤎", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "x" }, { action: commit, value: "X" }] } }
      c: { tap: "c", swipe_up: { label: "、", value: "、" }, swipe_down: { label: "又巴马厶龴ス", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "c" }, { action: commit, value: "C" }, { action: commit, value: "ç" }] } }
      v: { tap: "v", swipe_up: { label: "？", value: "?" }, swipe_down: { label: "女刀九臼巛彐", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "v" }, { action: commit, value: "V" }] } }
      b: { tap: "b", swipe_up: { label: "！", value: "!" }, swipe_down: { label: "子耳了也阝卩㔾凵", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "b" }, { action: commit, value: "B" }] } }
      n: { tap: "n", swipe_up: { label: "％", value: "%" }, swipe_down: { label: "已己巳心忄羽乙𠃜", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "n" }, { action: commit, value: "N" }, { action: commit, value: "ñ" }] } }
      m: { tap: "m", swipe_up: { label: "＃", value: "#" }, swipe_down: { label: "山由贝冂冎几", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "m" }, { action: commit, value: "M" }] } }
      # shift：单击切单击态、双击锁定大写；命令值走键盘按键路由（shift_single / shift_caps）
      shift: { width: 1.4, tap: { action: command, value: shift_single }, double_tap: { action: command, value: shift_caps } }
      # delete：单击删除、长按重复删、上滑清空、下滑撤回、左右滑清空输入
      delete: { width: 1.4, tap: { action: delete }, long_press: { values: [ { action: delete, label: "删除" } ] }, swipe_up: { action: clear_all, label: "上滑清空" }, swipe_down: { action: undo_clear, label: "下滑撤回" }, swipe_left: { action: command, value: clear_composition }, swipe_right: { action: command, value: clear_composition } }
      # ── 第四行功能键（位置/是否出现由上方 layout.rows 第四行决定；行为在此定义）──
      # ?123：单击切面板，长按弹出「数字 / 常用符号」（命令值走键盘按键路由）
      mode_change: { width: 1.2, tap: { action: command, value: mode_change, bubble: false }, long_press: { display: bubble, values: [ { label: number, action: command, value: mode_change_number }, { label: common_symbol, action: command, value: mode_change_common_symbol } ] } }
      # 空格键：单击上屏空格；长按进入语音输入（含麦克风权限校验）
      # 长按若想改为「重复空格」：long_press: { values: [ { action: repeat_space, value: 5 } ] }
      space: { width: 3, tap: { action: space }, long_press: { label: "语音", action: voice, bubble: false } }
      # 回车键
      enter: { width: 1.2, tap: { action: enter, bubble: false } }
      #  逗号键，label 为中文显示，value 为英文显示+提交值
      comma: { tap: { label: "，", value: "," }, swipe_up: { label: "。", value: "." } , long_press: { display: "bubble", values: [{ action: commit, value: "," }, { action: commit, value: "." }] }}


      # 中/英切换键，label 为按键显示文字
      earth: { tap: { label: "@language", action: "toggle_ascii" }, long_press: { display: "bubble", values: [ { label: "选择输入法", action: "command", value: "show_ime_picker" } ] } }
    
  # 英文键盘布局
  qwerty_en:
    # ── 按键布局模式 ──
    # standard: 默认布局（主文字居中，下滑提示在底部）
    # compact: 紧凑布局（主文字在左上，下滑提示占满键帽中部）
    button_layout: standard
    layout:
      # ── 行宽与对齐（均可选，写在 layout 下作用于整段键盘）──
      # columns:   参考列数，缺省取首行键数；uniform 下决定行宽与键宽
      # row_align: uniform（默认）= 键宽按列对齐、行居中；stretch = 行内均分铺满
      # 行可写成数组（继承键盘级策略），或对象形式做行级覆盖：
      #   - { keys: [a, s, d, f, g, h, j, k, l], align: stretch }   # 该行满宽均分
      #   - { keys: [z, x, c, v, b, n, m], width: 0.7 }             # 该行占 70% 宽（居中）
      # columns: 10
      # row_align: uniform
      rows:
        - [q, w, e, r, t, y, u, i, o, p]
        - [a, s, d, f, g, h, j, k, l]
        - [shift, z, x, c, v, b, n, m, delete]
        # 第四行（控制行）：位置/是否出现由本 rows 决定，行为在下方 keys.<id> 配置
        - [mode_change, comma, space, earth, enter]
    keys:
      # ── 第一行 ──
      q: { tap: "q", swipe_up: "1", long_press: { display: "bubble", values: [{ action: commit, value: "q" }, { action: commit, value: "Q" }] } }
      w: { tap: "w", swipe_up: "2", long_press: { display: "bubble", values: [{ action: commit, value: "w" }, { action: commit, value: "W" }] } }
      e: { tap: "e", swipe_up: "3", long_press: { display: "bubble", values: [{ action: commit, value: "e" }, { action: commit, value: "E" }] } }
      r: { tap: "r", swipe_up: "4", long_press: { display: "bubble", values: [{ action: commit, value: "r" }, { action: commit, value: "R" }] } }
      t: { tap: "t", swipe_up: "5", long_press: { display: "bubble", values: [{ action: commit, value: "t" }, { action: commit, value: "T" }] } }
      y: { tap: "y", swipe_up: "6", long_press: { display: "bubble", values: [{ action: commit, value: "y" }, { action: commit, value: "Y" }] } }
      u: { tap: "u", swipe_up: "7", long_press: { display: "bubble", values: [{ action: commit, value: "u" }, { action: commit, value: "U" }] } }
      i: { tap: "i", swipe_up: "8", long_press: { display: "bubble", values: [{ action: commit, value: "i" }, { action: commit, value: "I" }] } }
      o: { tap: "o", swipe_up: "9", long_press: { display: "bubble", values: [{ action: commit, value: "o" }, { action: commit, value: "O" }] } }
      p: { tap: "p", swipe_up: "0", long_press: { display: "bubble", values: [{ action: commit, value: "p" }, { action: commit, value: "P" }] } }
      # ── 第二行 ──
      a: { tap: "a", swipe_up: "~", long_press: { display: "bubble", values: [{ action: commit, value: "a" }, { action: commit, value: "A" }] } }
      s: { tap: "s", swipe_up: "/", long_press: { display: "bubble", values: [{ action: commit, value: "s" }, { action: commit, value: "S" }] } }
      d: { tap: "d", swipe_up: ":", long_press: { display: "bubble", values: [{ action: commit, value: "d" }, { action: commit, value: "D" }] } }
      f: { tap: "f", swipe_up: ";", long_press: { display: "bubble", values: [{ action: commit, value: "f" }, { action: commit, value: "F" }] } }
      g: { tap: "g", swipe_up: "\"", long_press: { display: "bubble", values: [{ action: commit, value: "g" }, { action: commit, value: "G" }] } }
      h: { tap: "h", swipe_up: "\"", long_press: { display: "bubble", values: [{ action: commit, value: "h" }, { action: commit, value: "H" }] } }
      j: { tap: "j", swipe_up: "-", long_press: { display: "bubble", values: [{ action: commit, value: "j" }, { action: commit, value: "J" }] } }
      k: { tap: "k", swipe_up: "(", long_press: { display: "bubble", values: [{ action: commit, value: "k" }, { action: commit, value: "K" }] } }
      l: { tap: "l", swipe_up: ")", long_press: { display: "bubble", values: [{ action: commit, value: "l" }, { action: commit, value: "L" }] } }
      # ";": { tap: ";", shift: ":" }

      # ── 第三行 ──
      z: { tap: "z", swipe_up: "*", long_press: { display: "bubble", values: [{ action: commit, value: "z" }, { action: commit, value: "Z" }] } }
      x: { tap: "x", swipe_up: "@", long_press: { display: "bubble", values: [{ action: commit, value: "x" }, { action: commit, value: "X" }] } }
      c: { tap: "c", swipe_up: "、", long_press: { display: "bubble", values: [{ action: commit, value: "c" }, { action: commit, value: "C" }] } }
      v: { tap: "v", swipe_up: "?", long_press: { display: "bubble", values: [{ action: commit, value: "v" }, { action: commit, value: "V" }] } }
      b: { tap: "b", swipe_up: "!", long_press: { display: "bubble", values: [{ action: commit, value: "b" }, { action: commit, value: "B" }] } }
      n: { tap: "n", swipe_up: "%", long_press: { display: "bubble", values: [{ action: commit, value: "n" }, { action: commit, value: "N" }] } }
      m: { tap: "m", swipe_up: "#", long_press: { display: "bubble", values: [{ action: commit, value: "m" }, { action: commit, value: "M" }] } }
      # shift：单击切单击态、双击锁定大写（命令值走键盘按键路由）
      shift: { width: 1.4, tap: { action: command, value: shift_single }, double_tap: { action: command, value: shift_caps } }
      # delete：单击删除、长按重复删、上滑清空、下滑撤回、左右滑清空输入
      delete: { width: 1.4, tap: { action: delete }, long_press: { values: [ { action: delete, label: "删除" } ] }, swipe_up: { action: clear_all, label: "上滑清空" }, swipe_down: { action: undo_clear, label: "下滑撤回" }, swipe_left: { action: command, value: clear_composition }, swipe_right: { action: command, value: clear_composition } }
      # ?123：单击切面板，长按弹出「数字 / 常用符号」
      mode_change: { width: 1.2, tap: { action: command, value: mode_change , bubble: false}, long_press: { display: bubble, values: [ { label: number, action: command, value: mode_change_number }, { label: common_symbol, action: command, value: mode_change_common_symbol } ] } }
      # 空格键：单击上屏空格；长按进入语音输入（含麦克风权限校验）
      # 长按若想改为「重复空格」：long_press: { values: [ { action: repeat_space, value: 5 } ] }
      space: { width: 3, tap: { action: space }, long_press: { label: "语音", action: voice, bubble: false } }
      # 回车键
      enter: { width: 1.2, tap: { action: enter } }
      #  逗号键，label 为中文显示，value 为英文显示+提交值
      comma: { tap: { label: ".", value: "." }, swipe_up: { label: ",", value: "," } }
      # 中/英切换键，label 为按键显示文字
      earth: { tap: { label: "@language", action: "toggle_ascii" , bubble: false}, long_press: { display: "bubble", values: [ { label: "选择输入法", action: "command", value: "show_ime_picker" } ] } }

  # ── 平板/大屏键盘布局（设备档变体）──
  # 平板（smallestWidth ≥ 600dp，不随横竖屏变化）上自动整段替换同名基础段
  # （qwerty_tablet 替换 qwerty、qwerty_en_tablet 替换 qwerty_en）；手机不受影响。
  # 行排布参考 Gboard 平板：行 1 左端 Tab、数字上标常驻加大；行 2 左端大写锁定键
  # （caps，单击切锁定）；行 3 两端 shift 对称、行尾逗号句号；底行两端 ?123 +
  # 表情 + 超宽空格 + 左右光标键。
  # 用户自定义 xime.custom.yaml 写同名 *_tablet 段即可覆盖内置平板布局。
  qwerty_tablet:
    button_layout: standard
    layout:
      rows:
        - [tab, q, w, e, r, t, y, u, i, o, p, delete]
        - [caps, a, s, d, f, g, h, j, k, l, enter]
        - [shift_left, z, x, c, v, b, n, m, comma, period, shift_right]
        # 第四行（控制行）：两端 ?123 + 表情 + 超宽空格 + 左右光标
        - [mode_change, emoji, space, cursor_left, cursor_right, mode_change]
    keys:
      # ── 第一行（数字上标常驻）──
      q: { tap: { value: "q", bubble: false }, swipe_up: "1", swipe_down: { label: "金 钅𠂊勺㐅 犭𱼀", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "q" }, { action: commit, value: "Q" }] } }
      w: { tap: { value: "w", bubble: false }, swipe_up: "2", swipe_down: { label: "人亻八癶", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "w" }, { action: commit, value: "W" }] } }
      e: { tap: { value: "e", bubble: false }, swipe_up: "3", swipe_down: { label: "月⺼彡乃用爫彡𧘇豕", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "e" }, { action: commit, value: "E" }, { action: commit, value: "è" }, { action: commit, value: "é" }, { action: commit, value: "ê" }, { action: commit, value: "ë" }] } }
      r: { tap: { value: "r", bubble: false }, swipe_up: "4", swipe_down: { label: "白手龵扌斤𰀪𠂆", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "r" }, { action: commit, value: "R" }] } }
      t: { tap: { value: "t", bubble: false }, swipe_up: "5", swipe_down: { label: "禾竹丿𠂉彳夂攵", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "t" }, { action: commit, value: "T" }] } }
      y: { tap: { value: "y", bubble: false }, swipe_up: "6", swipe_down: { label: "言讠文方广亠丶乀", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "y" }, { action: commit, value: "Y" }, { action: commit, value: "ÿ" }] } }
      u: { tap: { value: "u", bubble: false }, swipe_up: "7", swipe_down: { label: "立六辛冫丬门疒丷䒑", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "u" }, { action: commit, value: "U" }, { action: commit, value: "ù" }, { action: commit, value: "ú" }, { action: commit, value: "û" }, { action: commit, value: "ü" }] } }
      i: { tap: { value: "i", bubble: false }, swipe_up: "8", swipe_down: { label: "水氵小氺头𭕄⺌", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "i" }, { action: commit, value: "I" }, { action: commit, value: "ì" }, { action: commit, value: "í" }, { action: commit, value: "î" }, { action: commit, value: "ï" }] } }
      o: { tap: { value: "o", bubble: false }, swipe_up: "9", swipe_down: { label: "火灬米", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "o" }, { action: commit, value: "O" }, { action: commit, value: "ò" }, { action: commit, value: "ó" }, { action: commit, value: "ô" }, { action: commit, value: "õ" }, { action: commit, value: "ö" }, { action: commit, value: "ø" }] } }
      p: { tap: { value: "p", bubble: false }, swipe_up: "0", swipe_down: { label: "之辶冖宀廴礻", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "p" }, { action: commit, value: "P" }] } }
      # 退格：单击删除、长按重复删、上滑清空、下滑撤回、左右滑清空输入
      delete: { width: 1.1, tap: {  action: delete, bubble: false }, long_press: { values: [ { action: delete, label: "删除" } ] }, swipe_up: { action: clear_all, label: "上滑清空" }, swipe_down: { action: undo_clear, label: "下滑撤回" }, swipe_left: { action: command, value: clear_composition }, swipe_right: { action: command, value: clear_composition } }
      # ── 第二行 ──
      a: { tap: { value: "a", bubble: false }, swipe_up: { label: "～", value: "~" }, swipe_down: { label: "工匚戈艹廿龷七弋戈", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "a" }, { action: commit, value: "A" }, { action: commit, value: "à" }, { action: commit, value: "á" }, { action: commit, value: "â" }, { action: commit, value: "ã" }, { action: commit, value: "ä" }, { action: commit, value: "å" }, { action: commit, value: "æ" }] } }
      s: { tap: { value: "s", bubble: false }, swipe_up: { label: "／", value: "/" }, swipe_down: { label: "木丁西", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "s" }, { action: commit, value: "S" }, { action: commit, value: "ß" }] } }
      d: { tap: { value: "d", bubble: false }, swipe_up: { label: "：", value: ":" }, swipe_down: { label: "大犬三古龵镸石厂丆", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "d" }, { action: commit, value: "D" }] } }
      f: { tap: { value: "f", bubble: false }, swipe_up: { label: "；", value: ";" }, swipe_down: { label: "土士二干十寸雨", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "f" }, { action: commit, value: "F" }] } }
      g: { tap: { value: "g", bubble: false }, swipe_up: { label: "“", value: "“" }, swipe_down: { label: "王龶五一戋", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "g" }, { action: commit, value: "G" }] } }
      h: { tap: { value: "h", bubble: false }, swipe_up: { label: "”", value: "”" }, swipe_down: { label: "目丨卜⺊上止龰", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "h" }, { action: commit, value: "H" }] } }
      j: { tap: { value: "j", bubble: false }, swipe_up: { label: "－", value: "-" }, swipe_down: { label: "日曰早廾刂虫丿Ⅱ", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "j" }, { action: commit, value: "J" }] } }
      k: { tap: { value: "k", bubble: false }, swipe_up: { label: "（", value: "(" }, swipe_down: { label: "口Ⅲ川", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "k" }, { action: commit, value: "K" }] } }
      l: { tap: { value: "l", bubble: false }, swipe_up: { label: "）", value: ")" }, swipe_down: { label: "田甲囗四罒车皿力", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "l" }, { action: commit, value: "L" }] } }
      # 回车移到本行行尾（Gboard 平板排布）
      enter: { width: 1.4, tap: {  action: enter, bubble: false } }
      # 大写锁定键（行 2 左端）：单击切换大写锁定，CAPS 态键面高亮
      caps: { width: 1.3 }
      # ── 第三行（左右 shift 独立 id：shift_left/shift_right 可分别配置宽度与手势；
      # 未配置的手势沿用内置 shift 状态机：单击切单击态、双击锁定大写）──
      shift_left: { width: 1.6 }
      shift_right: { width: 1.2 }
      z: { tap: { value: "z", bubble: false }, swipe_up: { label: "＊", value: "*" }, swipe_down: { label: "", action: "none", display: "key", bubble: false }, long_press: { display: "bubble", values: [{ action: commit, value: "z" }, { action: commit, value: "Z" }] } }
      x: { tap: { value: "x", bubble: false }, swipe_up: { label: "＠", value: "@" }, swipe_down: { label: "弓匕纟幺弓𠤎", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "x" }, { action: commit, value: "X" }] } }
      c: { tap: { value: "c", bubble: false }, swipe_up: { label: "、", value: "、" }, swipe_down: { label: "又巴马厶龴ス", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "c" }, { action: commit, value: "C" }, { action: commit, value: "ç" }] } }
      v: { tap: { value: "v", bubble: false }, swipe_up: { label: "？", value: "?" }, swipe_down: { label: "女刀九臼巛彐", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "v" }, { action: commit, value: "V" }] } }
      b: { tap: { value: "b", bubble: false }, swipe_up: { label: "！", value: "!" }, swipe_down: { label: "子耳了也阝卩㔾凵", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "b" }, { action: commit, value: "B" }] } }
      n: { tap: { value: "n", bubble: false }, swipe_up: { label: "％", value: "%" }, swipe_down: { label: "已己巳心忄羽乙𠃜", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "n" }, { action: commit, value: "N" }, { action: commit, value: "ñ" }] } }
      m: { tap: { value: "m", bubble: false }, swipe_up: { label: "＃", value: "#" }, swipe_down: { label: "山由贝冂冎几", action: "none", display: "bubble" }, long_press: { display: "bubble", values: [{ action: commit, value: "m" }, { action: commit, value: "M" }] } }
      # 逗号/句号独立成键（value 经 rime 引擎，中文态自动转全角）
      comma: { width: 1, tap: {  label: "，", value: ",", bubble: false } }
      period: { width: 1, tap: {  label: "。", value: ".", bubble: false } }
      # ── 第四行（控制行）──
      # 两端 ?123：单击切面板，长按弹出「数字 / 常用符号」
      mode_change: { width: 1.2, tap: {  action: command, value: mode_change, bubble: false }, long_press: { display: bubble, values: [ { label: number, action: command, value: mode_change_number }, { label: common_symbol, action: command, value: mode_change_common_symbol } ] } }
      # 空格键：单击上屏空格；长按进入语音输入（含麦克风权限校验）
      space: { width: 5.5, tap: {  action: space, bubble: false }, long_press: { label: "语音", action: voice, bubble: false } }
      # 左右光标键：组合态移动编码编辑光标、空闲态移动编辑器光标
      cursor_left: { tap: {  action: cursor_left, bubble: false } }
      cursor_right: { tap: {  action: cursor_right, bubble: false } }
      # Tab 键（行 1 左端，Gboard 平板排布）
      tab: { width: 1.1, tap: {  action: tab, bubble: false } }

  # 英文平板布局（与中文平板同排布，字母键无五笔字根提示）
  qwerty_en_tablet:
    button_layout: standard
    layout:
      rows:
        - [tab, q, w, e, r, t, y, u, i, o, p, delete]
        - [caps, a, s, d, f, g, h, j, k, l, enter]
        - [shift_left, z, x, c, v, b, n, m, comma, period, shift_right]
        - [mode_change, emoji, space, cursor_left, cursor_right, mode_change]
    keys:
      q: { tap: { value: "q", bubble: false }, swipe_up: "1", long_press: { display: "bubble", values: [{ action: commit, value: "q" }, { action: commit, value: "Q" }] } }
      w: { tap: { value: "w", bubble: false }, swipe_up: "2", long_press: { display: "bubble", values: [{ action: commit, value: "w" }, { action: commit, value: "W" }] } }
      e: { tap: { value: "e", bubble: false }, swipe_up: "3", long_press: { display: "bubble", values: [{ action: commit, value: "e" }, { action: commit, value: "E" }] } }
      r: { tap: { value: "r", bubble: false }, swipe_up: "4", long_press: { display: "bubble", values: [{ action: commit, value: "r" }, { action: commit, value: "R" }] } }
      t: { tap: { value: "t", bubble: false }, swipe_up: "5", long_press: { display: "bubble", values: [{ action: commit, value: "t" }, { action: commit, value: "T" }] } }
      y: { tap: { value: "y", bubble: false }, swipe_up: "6", long_press: { display: "bubble", values: [{ action: commit, value: "y" }, { action: commit, value: "Y" }] } }
      u: { tap: { value: "u", bubble: false }, swipe_up: "7", long_press: { display: "bubble", values: [{ action: commit, value: "u" }, { action: commit, value: "U" }] } }
      i: { tap: { value: "i", bubble: false }, swipe_up: "8", long_press: { display: "bubble", values: [{ action: commit, value: "i" }, { action: commit, value: "I" }] } }
      o: { tap: { value: "o", bubble: false }, swipe_up: "9", long_press: { display: "bubble", values: [{ action: commit, value: "o" }, { action: commit, value: "O" }] } }
      p: { tap: { value: "p", bubble: false }, swipe_up: "0", long_press: { display: "bubble", values: [{ action: commit, value: "p" }, { action: commit, value: "P" }] } }
      delete: { width: 1.2, tap: {  action: delete, bubble: false }, long_press: { values: [ { action: delete, label: "删除" } ] }, swipe_up: { action: clear_all, label: "上滑清空" }, swipe_down: { action: undo_clear, label: "下滑撤回" }, swipe_left: { action: command, value: clear_composition }, swipe_right: { action: command, value: clear_composition } }
      a: { tap: { value: "a", bubble: false }, swipe_up: "~", long_press: { display: "bubble", values: [{ action: commit, value: "a" }, { action: commit, value: "A" }] } }
      s: { tap: { value: "s", bubble: false }, swipe_up: "/", long_press: { display: "bubble", values: [{ action: commit, value: "s" }, { action: commit, value: "S" }] } }
      d: { tap: { value: "d", bubble: false }, swipe_up: ":", long_press: { display: "bubble", values: [{ action: commit, value: "d" }, { action: commit, value: "D" }] } }
      f: { tap: { value: "f", bubble: false }, swipe_up: ";", long_press: { display: "bubble", values: [{ action: commit, value: "f" }, { action: commit, value: "F" }] } }
      g: { tap: { value: "g", bubble: false }, swipe_up: "\"", long_press: { display: "bubble", values: [{ action: commit, value: "g" }, { action: commit, value: "G" }] } }
      h: { tap: { value: "h", bubble: false }, swipe_up: "\"", long_press: { display: "bubble", values: [{ action: commit, value: "h" }, { action: commit, value: "H" }] } }
      j: { tap: { value: "j", bubble: false }, swipe_up: "-", long_press: { display: "bubble", values: [{ action: commit, value: "j" }, { action: commit, value: "J" }] } }
      k: { tap: { value: "k", bubble: false }, swipe_up: "(", long_press: { display: "bubble", values: [{ action: commit, value: "k" }, { action: commit, value: "K" }] } }
      l: { tap: { value: "l", bubble: false }, swipe_up: ")", long_press: { display: "bubble", values: [{ action: commit, value: "l" }, { action: commit, value: "L" }] } }
      enter: { width: 1.4, tap: {  action: enter, bubble: false } }
      caps: { width: 1.4 }
      shift_left: { width: 1.6 }
      shift_right: { width: 1.2 }
      z: { tap: { value: "z", bubble: false }, swipe_up: "*", long_press: { display: "bubble", values: [{ action: commit, value: "z" }, { action: commit, value: "Z" }] } }
      x: { tap: { value: "x", bubble: false }, swipe_up: "@", long_press: { display: "bubble", values: [{ action: commit, value: "x" }, { action: commit, value: "X" }] } }
      c: { tap: { value: "c", bubble: false }, swipe_up: "、", long_press: { display: "bubble", values: [{ action: commit, value: "c" }, { action: commit, value: "C" }] } }
      v: { tap: { value: "v", bubble: false }, swipe_up: "?", long_press: { display: "bubble", values: [{ action: commit, value: "v" }, { action: commit, value: "V" }] } }
      b: { tap: { value: "b", bubble: false }, swipe_up: "!", long_press: { display: "bubble", values: [{ action: commit, value: "b" }, { action: commit, value: "B" }] } }
      n: { tap: { value: "n", bubble: false }, swipe_up: "%", long_press: { display: "bubble", values: [{ action: commit, value: "n" }, { action: commit, value: "N" }] } }
      m: { tap: { value: "m", bubble: false }, swipe_up: "#", long_press: { display: "bubble", values: [{ action: commit, value: "m" }, { action: commit, value: "M" }] } }
      comma: { width: 1, tap: {  label: ",", value: ",", bubble: false } }
      period: { width: 1, tap: {  label: ".", value: ".", bubble: false } }
      mode_change: { width: 1.2, tap: {  action: command, value: mode_change, bubble: false }, long_press: { display: bubble, values: [ { label: number, action: command, value: mode_change_number }, { label: common_symbol, action: command, value: mode_change_common_symbol } ] } }
      space: { width: 5.5, tap: {  action: space, bubble: false }, long_press: { label: "语音", action: voice, bubble: false } }
      cursor_left: { tap: {  action: cursor_left, bubble: false } }
      cursor_right: { tap: {  action: cursor_right, bubble: false } }
      tab: { width: 1.2, tap: {  action: tab, bubble: false } }

  # ── 合并键布局（14/17/18 键）──
  # rows 支持子数组：[[q, w], [e, r], ...] 表示 q/w 合并在同一个键，每行键数变少键自然更宽（行内等宽）。
  # 合并键在 keys 里的 id 为组内字母拼接（qw、er...），tap 的 value 固定为组内第一个字母（代表字母），
  # Rime 侧由方案的拼写运算（derive + xlit）靠词库消歧。
  # swipe_up：前 10 个键按行序输出数字 1-0，其余键沿用 26 键同字母的符号习惯；
  # long_press 气泡保留组内字母的精确输入作为辅助。
  #
  # schemas 声明使用此布局的方案（schema_id），前端据此在方案切换时加载对应 section，
  # 新增合并键布局只需加 section + 声明 schemas（可写入 xime.custom.yaml），无需改代码。
  # 一个 section 可被多个方案复用；未声明 schemas 的方案一律使用全键盘（26 键）。
  #
  # 拼音 14 键：qw/er/ty/ui/op、as/df/gh/jk/l、zx/cv/bn/m（对应方案 pinyin_14jian）
  qwerty_14:
    schemas: [pinyin_14jian]
    button_layout: standard
    layout:
      # 合并键布局按各行键数铺满（行短于首行也不居中），保持既有观感
      row_align: stretch
      rows:
        - [[q, w], [e, r], [t, y], [u, i], [o, p]]
        - [[a, s], [d, f], [g, h], [j, k], [l]]
        - [[z, x], [c, v], [b, n], [m]]
    keys:
      # swipe_up 数字按行序排布：上排 1-5、中排 6-0
      qw: { tap: { label: "qw", value: "q" }, swipe_up: "1", long_press: { display: "bubble", values: [{ action: commit, value: "q" }, { action: commit, value: "w" }, { action: commit, value: "Q" }, { action: commit, value: "W" }] } }
      er: { tap: { label: "er", value: "e" }, swipe_up: "2", long_press: { display: "bubble", values: [{ action: commit, value: "e" }, { action: commit, value: "r" }, { action: commit, value: "E" }, { action: commit, value: "R" }] } }
      ty: { tap: { label: "ty", value: "t" }, swipe_up: "3", long_press: { display: "bubble", values: [{ action: commit, value: "t" }, { action: commit, value: "y" }, { action: commit, value: "T" }, { action: commit, value: "Y" }] } }
      ui: { tap: { label: "ui", value: "u" }, swipe_up: "4", long_press: { display: "bubble", values: [{ action: commit, value: "u" }, { action: commit, value: "i" }, { action: commit, value: "U" }, { action: commit, value: "I" }] } }
      op: { tap: { label: "op", value: "o" }, swipe_up: "5", long_press: { display: "bubble", values: [{ action: commit, value: "o" }, { action: commit, value: "p" }, { action: commit, value: "O" }, { action: commit, value: "P" }] } }
      as: { tap: { label: "as", value: "a" }, swipe_up: "6", long_press: { display: "bubble", values: [{ action: commit, value: "a" }, { action: commit, value: "s" }, { action: commit, value: "A" }, { action: commit, value: "S" }] } }
      df: { tap: { label: "df", value: "d" }, swipe_up: "7", long_press: { display: "bubble", values: [{ action: commit, value: "d" }, { action: commit, value: "f" }, { action: commit, value: "D" }, { action: commit, value: "F" }] } }
      gh: { tap: { label: "gh", value: "g" }, swipe_up: "8", long_press: { display: "bubble", values: [{ action: commit, value: "g" }, { action: commit, value: "h" }, { action: commit, value: "G" }, { action: commit, value: "H" }] } }
      jk: { tap: { label: "jk", value: "j" }, swipe_up: "9", long_press: { display: "bubble", values: [{ action: commit, value: "j" }, { action: commit, value: "k" }, { action: commit, value: "J" }, { action: commit, value: "K" }] } }
      l:  { tap: { label: "l", value: "l" }, swipe_up: "0", long_press: { display: "bubble", values: [{ action: commit, value: "l" }, { action: commit, value: "L" }] } }
      zx: { tap: { label: "zx", value: "z" }, swipe_up: "*", long_press: { display: "bubble", values: [{ action: commit, value: "z" }, { action: commit, value: "x" }, { action: commit, value: "Z" }, { action: commit, value: "X" }] } }
      cv: { tap: { label: "cv", value: "c" }, swipe_up: "、", long_press: { display: "bubble", values: [{ action: commit, value: "c" }, { action: commit, value: "v" }, { action: commit, value: "C" }, { action: commit, value: "V" }] } }
      bn: { tap: { label: "bn", value: "b" }, swipe_up: "!", long_press: { display: "bubble", values: [{ action: commit, value: "b" }, { action: commit, value: "n" }, { action: commit, value: "B" }, { action: commit, value: "N" }] } }
      m:  { tap: { label: "m", value: "m" }, swipe_up: "#", long_press: { display: "bubble", values: [{ action: commit, value: "m" }, { action: commit, value: "M" }] } }
      comma: { tap: { label: "，", value: "," }, swipe_up: { label: "。", value: "." } , long_press: { display: "bubble", values: [{ action: commit, value: "," }, { action: commit, value: "." }] }}
      earth: { tap: { label: "@language", action: "toggle_ascii" }, long_press: { display: "bubble", values: [ { label: "选择输入法", action: "command", value: "show_ime_picker" } ] } }

