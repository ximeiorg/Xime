      p:  { tap: { label: "p", value: "p" }, swipe_up: "7", long_press: { display: "bubble", values: [{ action: commit, value: "p" }, { action: commit, value: "P" }] } }
      a:  { tap: { label: "a", value: "a" }, swipe_up: "8", long_press: { display: "bubble", values: [{ action: commit, value: "a" }, { action: commit, value: "A" }] } }
      sd: { tap: { label: "sd", value: "s" }, swipe_up: "9", long_press: { display: "bubble", values: [{ action: commit, value: "s" }, { action: commit, value: "d" }, { action: commit, value: "S" }, { action: commit, value: "D" }] } }
      fg: { tap: { label: "fg", value: "f" }, swipe_up: "0", long_press: { display: "bubble", values: [{ action: commit, value: "f" }, { action: commit, value: "g" }, { action: commit, value: "F" }, { action: commit, value: "G" }] } }
      h:  { tap: { label: "h", value: "h" }, swipe_up: "”", long_press: { display: "bubble", values: [{ action: commit, value: "h" }, { action: commit, value: "H" }] } }
