  # ── 合并键布局（14/17/18 键）──
  # rows 支持子数组：[[q, w], [e, r], ...] 表示 q/w 合并在同一个键，每行键数变少键自然更宽（行内等宽）。
  # 合并键在 keys 里的 id 为组内字母拼接（qw、er...），tap 的 value 固定为组内第一个字母（代表字母），
  # Rime 侧由方案的拼写运算（derive + xlit）靠词库消歧。
  # swipe_up：前 10 个键按行序输出数字 1-0，其余键沿用 26 键同字母的符号习惯；
  # long_press 气泡保留组内字母的精确输入作为辅助。
  #
  # schemas 声明使用此布局的方案（schema_id），前端据此在方案切换时加载对应 section，
  # 新增合并键布局只需加 section + 声明 schemas（可写入 xime.custom.yaml），无需改代码。
