metadata:
  app_name: Xime
  app_version: ">=2.5.0"
  platform: android
  config_version: 1
  generator: "Xime Config Generator" # 暂时无用
  modified_time: "2026-07-05"

xime_index:
  # 方案/插件/模型市场索引端点（ximeiorg/xime-index）。
  # 可替换为自建代理/镜像，下载器按顺序依次尝试，直到成功为止。
  # 末尾需要 /。
  base_urls:
    - "https://cdn.jsdelivr.net/gh/ximeiorg/xime-index@master/"
    - "https://fastly.jsdelivr.net/gh/ximeiorg/xime-index@master/"
    - "https://index.ximei.me/"
    - "https://raw.githubusercontent.com/ximeiorg/xime-index/refs/heads/main/"

style:
  # 浅色/深色模式的配色，deep 为降级后备
  # 可选值：内置主题 id、color_schemes 中定义的 id、或 dynamic（Material You 动态配色，随壁纸取色，仅 Android 12+ 生效）
  color_scheme:
    light: lavender_purple
    dark: slate_gray
  # 显示模式：0=浅色, 1=深色, 2=跟随系统（默认）
  dark_mode: 2

# 配色方案可配置背景类型（纯色/渐变/图片），默认均为纯色。
# 如需渐变/图片背景，在 xime.custom.yaml 的对应主题下覆盖 keyboard_background 即可：
#
#   keyboard_background:
#     type: gradient
#     colors: [0x8F73E2, 0xE8DEF8]        # 亮色渐变断点
#     colors_dark: [0x4A3F7A, 0x2D2040]    # 暗色渐变断点（可选）
#     angle: 90                            # 角度制
#  
#   keyboard_background:
#     type: image
#     src: "themes/lavender_bg.png"          # 相对于 rime/ 用户目录（优先）或 assets/
#     fit: cover                             # cover | contain | fill | fit_width | fit_height | none
#
# 自定义图片背景有两种方式：
# 1. 在系统相册/文件管理中把图片「分享到 Xime」，图片会自动存入
#    rime/themes/custom_<时间戳>.jpg，并把可用的 color_schemes 配置模板复制到剪贴板，
#    粘贴到 rime/xime.custom.yaml 后即可在主题设置中选择。
# 2. 手动把图片放入 rime/themes/（如通过 USB 或文件管理器），然后在
#    xime.custom.yaml 中添加引用它的 color_scheme，src 写相对 rime/ 的路径。
#    内置主题的同名文件会被用户目录中的文件覆盖。
#
# color_schemes 每个主题可用的颜色字段（未设置的会回退到全局 keyboard.colors 默认值）：
#   primary_color          - 主题强调色（种子色）
#   keyboard_bg_color      - 键盘背景后备色（配置了 keyboard_background 时以 background 为准）
#   key_bg_color / key_bg_color_dark           - 按键底色（亮/暗）
#   special_key_bg_color / _dark               - 特殊按键底色（亮/暗）
#   candidate_bar_bg_color                     - 候选栏底色
#   key_text_color / key_text_color_dark       - 按键文字色（亮/暗）
#   candidate_text_color / _dark               - 候选文字色（亮/暗）
#   candidate_selected_text_color / _dark      - 候选选中文字色（亮/暗），未设置时回退到
#                                                 key_text_color（图片背景看不清时建议单独配置）
#
color_schemes:
  # 动态配色（Material You）：颜色由运行时从壁纸调色板派生，随壁纸变化，
  # 仅 Android 12+（API 31+）生效，低版本不显示此方案。
  # dynamic_color: true 时忽略静态颜色字段；style.color_scheme 可用 dynamic 引用。
  dynamic:
    name: "动态配色"
    dynamic_color: true

