      xc: { tap: { label: "xc", value: "x" }, swipe_up: "@", long_press: { display: "bubble", values: [{ action: commit, value: "x" }, { action: commit, value: "c" }, { action: commit, value: "X" }, { action: commit, value: "C" }] } }
