[package]
name = "xime-p2p-jni"
version = "0.1.0"
edition = "2024"
license = "GPL-3.0-or-later"
publish = false
description = "xime-p2p 的 Android JNI 绑定（仅供 Xime 安卓输入法使用）"

# 只在 scripts/build-p2p-android.sh 生成的裁剪工作区里编译：
# 脚本会把本目录拷到 crates/xime-p2p-jni，旁边的路径依赖才成立。
# 同目录的 Cargo.lock 是那个「四 crate 临时 workspace」的完整依赖锁定：
# 既让 F-Droid 能从这个 Cargo.toml 向上找到 lockfile 固定全部版本，也由脚本
# 复制成临时 workspace 的构建起点。刷新方法见 build-p2p-android.sh 的注释，
# 不要在本目录直接跑 cargo build（path 依赖与 workspace 继承都不成立）。
[lib]
name = "xime_p2p_jni"
crate-type = ["cdylib"]

[dependencies]
jni = { version = "0.22.4", default-features = false }
xime-p2p-c = { path = "../xime-p2p-c" }
