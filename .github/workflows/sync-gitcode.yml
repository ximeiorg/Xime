name: Sync Release to GitCode

# GitCode 侧的代码是每日拉取的镜像，tag 到达 GitCode 天然有延迟，所以在 release.yml 里
# 跟着发版同步 Release 不可行（新 tag 那时还没到 GitCode）。
#
# 这里改成定时巡检：每天扫一遍最近的 Release，GitCode 上还没有的补建、附件不齐的补传，
# 已经齐的直接跳过。手工触发仍可按指定 tag 立即同步（补历史版本用）。
#
# 注意：Release 由脚本自己调 v5 POST 创建，不需要人在网页上建。发版时创建失败基本是
# 因为 tag 还没镜像到 GitCode，等下一轮巡检重试即可；若长期提示镜像仓库限制，再考虑
# 用 vars.GITCODE_RELEASE_REPO 指向普通仓库。

on:
  schedule:
    # 每天 UTC 03:00（北京时间 11:00）巡检一次
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      tag:
        description: '要同步的 tag，多个用逗号分隔；留空 = GitHub 最新正式版'
        required: false
        default: ''
      exclude:
        description: '排除的文件名正则，多个用逗号分隔（例如 ^xipm-）'
        required: false
        default: ''
      include_prerelease:
        description: '包含预发布版本（nightly 等）'
        type: boolean
        default: false
      dry_run:
        description: '仅预览同步计划，不写入 GitCode'
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout sync script
        uses: actions/checkout@v7
        with:
          sparse-checkout: scripts
          persist-credentials: false

      - name: Sync releases
        env:
          GITCODE_TOKEN: ${{ secrets.GITCODE_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITCODE_RELEASE_REPO: ${{ vars.GITCODE_RELEASE_REPO }}
          TAGS: ${{ inputs.tag }}
          EXCLUDE: ${{ inputs.exclude }}
          INCLUDE_PRE: ${{ inputs.include_prerelease }}
          DRY_RUN: ${{ inputs.dry_run }}
          RECONCILE: ${{ github.event_name == 'schedule' }}
        run: |
          set -u

          if [ -z "${GITCODE_TOKEN:-}" ] && [ "$DRY_RUN" != "true" ]; then
            echo "::error::缺少 GITCODE_TOKEN，请在 Settings → Secrets 中配置"
            exit 1
          fi

          common=()
          if [ -n "${GITCODE_RELEASE_REPO:-}" ]; then common+=(--gitcode-repo "$GITCODE_RELEASE_REPO"); fi
          if [ "$INCLUDE_PRE" = "true" ]; then common+=(--include-prerelease); fi
          if [ "$DRY_RUN" = "true" ]; then common+=(--dry-run); fi
          if [ -n "${EXCLUDE:-}" ]; then
            IFS=',' read -ra items <<< "$EXCLUDE"
            for item in "${items[@]}"; do
              item="$(echo "$item" | xargs)"
              [ -n "$item" ] && common+=(--exclude "$item")
            done
          fi

          status=0
          if [ -z "${TAGS// /}" ]; then
            if [ "$RECONCILE" = "true" ]; then
              # 巡检最近 3 个版本（含预发布）：镜像同步滞后时，这轮没赶上的下轮还能补
              python3 scripts/sync-release-to-gitcode.py \
                --last 3 --include-prerelease --tag-filter "" --skip-synced \
                "${common[@]}" || status=1
            else
              python3 scripts/sync-release-to-gitcode.py "${common[@]}" || status=1
            fi
          else
            IFS=',' read -ra items <<< "$TAGS"
            for item in "${items[@]}"; do
              tag="$(echo "$item" | xargs)"
              [ -z "$tag" ] && continue
              python3 scripts/sync-release-to-gitcode.py --tag "$tag" "${common[@]}" || status=1
            done
          fi
          exit $status
