      "6": { background: 0xFF4DD0E1, background_dark: 0xFF006064 }
      "7": { background: 0xFF64B5F6, background_dark: 0xFF0D47A1 }
      "8": { background: 0xFF7986CB, background_dark: 0xFF1A237E }
      "9": { background: 0xFFBA68C8, background_dark: 0xFF4A148C }
      "0": { background: 0xFFF06292, background_dark: 0xFF880E4F }
      back: { corner_radius: 14, background: 0xFFE1BEE7, background_dark: 0xFF6A1B9A }
      delete: { corner_radius: 14, background: 0xFFFFCDD2, background_dark: 0xFFB71C1C }
      open_symbols: { corner_radius: 14, background: 0xFFFFE082, background_dark: 0xFFE65100 }
